name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q job-radar/scripts job-radar/tests
      - name: Run unit tests
        env:
          PYTHONPATH: job-radar/scripts
        run: python -m unittest discover -s job-radar/tests -t job-radar -v
