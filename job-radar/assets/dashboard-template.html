<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Job Radar · 求职工作台</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #e2e7ef;
      --soft: #f6f8fb;
      --brand: #2457d6;
      --brand-soft: #eef3ff;
      --good: #08775a;
      --good-soft: #eaf7f2;
      --warn: #9a5700;
      --warn-soft: #fff4df;
      --bad: #b42318;
      --bad-soft: #fff0ee;
      --shadow: 0 4px 16px rgba(20, 35, 60, .06);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fff; }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    a { color: var(--brand); }
    :focus-visible { outline: 3px solid rgba(36, 87, 214, .24); outline-offset: 2px; }
    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
    .eyebrow { color: var(--brand); font-size: 12px; font-weight: 760; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 6px 0 5px; font-size: clamp(27px, 4vw, 36px); letter-spacing: -.035em; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin: 0; font-size: 14px; }
    .mode { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .compact-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .compact-metrics article { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
    .compact-metrics span { display: block; color: var(--muted); font-size: 12px; }
    .compact-metrics strong { display: block; margin-top: 5px; font-size: 22px; }
    .tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
    .tab { flex: 1; min-height: 42px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-weight: 700; }
    .tab.active { color: var(--ink); background: #fff; box-shadow: 0 1px 3px rgba(20, 35, 60, .08); }
    .panel { display: none; margin-top: 14px; }
    .panel.active { display: block; }
    .filters { margin-bottom: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
    .filter-main { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
    .advanced-filters { margin-top: 8px; }
    .advanced-filters summary, details summary { color: var(--muted); cursor: pointer; font-size: 13px; }
    .advanced-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fff; }
    input, select { min-height: 40px; padding: 8px 10px; }
    textarea { min-height: 84px; padding: 10px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); outline: none; }
    .range-field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 0 9px; border: 1px solid var(--line); border-radius: 9px; }
    .range-field input { min-height: 38px; padding: 0; border: 0; box-shadow: none; }
    .company-list, .application-list { display: grid; gap: 14px; }
    .company-card, .application-card { border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
    .company-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px; border-bottom: 1px solid var(--line); }
    .company-identity { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .company-mark { display: inline-flex; flex: 0 0 42px; width: 42px; height: 42px; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; color: #fff; background: #344054; font-size: 13px; font-weight: 820; letter-spacing: -.02em; }
    .company-mark.brand-oppo { color: #078148; background: #effaf4; font-size: 11px; letter-spacing: -.08em; }
    .company-mark.brand-huawei { color: #c7000b; background: #fff1f1; }
    .company-mark.brand-bytedance { color: #155eef; background: #edf4ff; }
    .company-mark.brand-baidu { color: #2932e1; background: #f1f2ff; }
    .company-mark.brand-dji { color: #111827; background: #f4f4f5; }
    .company-mark.brand-keda { color: #0d6e9e; background: #edf8fc; }
    .company-header h2, .application-card h2 { margin: 0; font-size: 19px; letter-spacing: -.015em; }
    .company-meta { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .policy-badge, .status-badge { display: inline-flex; align-items: center; min-height: 28px; padding: 4px 9px; border-radius: 999px; color: var(--muted); background: var(--soft); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .policy-badge.verified, .status-badge.good { color: var(--good); background: var(--good-soft); }
    .policy-badge.conflict { color: var(--warn); background: var(--warn-soft); }
    .quota-warning { margin: 12px 16px 0; padding: 9px 11px; border-left: 3px solid var(--warn); color: var(--warn); background: var(--warn-soft); font-size: 13px; }
    .primary-job { padding: 16px; }
    .section-label { margin-bottom: 9px; color: var(--brand); font-size: 12px; font-weight: 760; letter-spacing: .06em; }
    .job-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .job-title { margin: 0; font-size: 18px; }
    .job-title-link { color: var(--ink); text-decoration-color: #a9b9e8; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .job-title-link:hover { color: var(--brand); text-decoration-color: var(--brand); }
    .job-meta { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .score-text { color: var(--brand); font-size: 13px; font-weight: 760; white-space: nowrap; }
    .job-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .verification { display: inline-flex; align-items: center; gap: 5px; }
    .verification::before { width: 7px; height: 7px; border-radius: 50%; background: #98a2b3; content: ""; }
    .verification.verified { color: var(--good); }
    .verification.verified::before { background: #12b76a; }
    .verification.pending { color: var(--warn); }
    .verification.pending::before { background: #f79009; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
    .search-hint { color: var(--muted); font-size: 12px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fff; text-decoration: none; font-weight: 680; }
    .button.primary { border-color: var(--brand); color: #fff; background: var(--brand); }
    .button.danger { color: var(--bad); }
    .button:disabled { opacity: .5; cursor: not-allowed; }
    .alternative-section { padding: 0 16px 14px; }
    .alternative-section h3 { margin: 0 0 7px; font-size: 13px; }
    .alternative-row { padding: 11px 0; border-top: 1px solid var(--line); }
    .alternative-row:first-of-type { border-top: 0; }
    .alternative-title { font-size: 14px; font-weight: 680; }
    .alternative-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .other-jobs { margin: 0 16px 16px; padding-top: 10px; border-top: 1px solid var(--line); }
    .empty { padding: 36px 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
    .save-state { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .save-state.good { color: var(--good); }
    .save-state.bad { color: var(--bad); }
    .application-card { padding: 16px; }
    .application-head { display: grid; grid-template-columns: minmax(0, 1fr) 180px; align-items: center; gap: 18px; }
    .application-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .application-status label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .footer { margin-top: 24px; color: var(--muted); text-align: center; font-size: 11px; }
    @media (max-width: 680px) {
      .shell { width: min(100% - 20px, 960px); padding-top: 12px; }
      .hero { align-items: center; margin-bottom: 10px; }
      .hero h1 { margin: 2px 0 0; font-size: 28px; }
      .hero .subtitle { display: none; }
      .mode { padding: 5px 8px; }
      .compact-metrics { grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
      .compact-metrics article { min-width: 0; padding: 8px 4px; text-align: center; }
      .compact-metrics span { min-height: 30px; font-size: 10px; line-height: 1.35; }
      .compact-metrics strong { margin-top: 1px; font-size: 18px; }
      .panel { margin-top: 10px; }
      .filters { margin-bottom: 10px; padding: 8px; }
      .filter-main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-main input { grid-column: span 2; }
      .advanced-grid { grid-template-columns: 1fr; }
      .company-header { align-items: flex-start; padding: 12px 14px; }
      .job-head { align-items: flex-start; flex-direction: column; }
      .application-head { grid-template-columns: 1fr; align-items: flex-start; }
      .button, button, select { min-height: 44px; }
      .primary-job { padding: 14px; }
      .company-header, .application-card { padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow">Job Radar</div>
        <h1>求职工作台</h1>
        <p class="subtitle">先选公司，再决定主投岗位。</p>
      </div>
      <div class="mode">__MODE_LABEL__</div>
    </header>

    <section class="compact-metrics" aria-label="关键进度">
      <article><span>待选择公司</span><strong id="metric-companies">0</strong></article>
      <article><span>准备中</span><strong id="metric-preparing">0</strong></article>
      <article><span>已投递</span><strong id="metric-applied">0</strong></article>
      <article><span>面试中</span><strong id="metric-interviews">0</strong></article>
    </section>

    <nav class="tabs" aria-label="工作台页签">
      <button class="tab active" data-tab="recommendations" type="button">岗位推荐</button>
      <button class="tab" data-tab="applications" type="button">投递进度</button>
    </nav>

    <section class="panel active" data-panel="recommendations">
      <div class="filters">
        <div class="filter-main">
          <input id="filter-query" aria-label="关键词" placeholder="搜索公司、岗位或技能">
          <select id="filter-city" aria-label="城市"><option value="">全部城市</option></select>
          <select id="filter-status" aria-label="岗位状态">
            <option value="">全部状态</option>
            <option value="discovered">新发现</option>
            <option value="saved">已收藏</option>
            <option value="preparing">准备中</option>
            <option value="applied">已投递</option>
            <option value="ignored">已忽略</option>
            <option value="expired">已过期</option>
            <option value="archived">已归档</option>
          </select>
        </div>
        <details class="advanced-filters">
          <summary>高级筛选</summary>
          <div class="advanced-grid">
            <select id="filter-type" aria-label="招聘类型">
              <option value="">全部类型</option>
              <option value="campus">校招</option>
              <option value="experienced">社招</option>
              <option value="internship">实习</option>
            </select>
            <select id="filter-source" aria-label="来源"><option value="">全部来源</option></select>
            <select id="filter-freshness" aria-label="新鲜度">
              <option value="">全部时间</option>
              <option value="7">7 天内</option>
              <option value="30">30 天内</option>
              <option value="60">60 天内</option>
            </select>
            <div class="range-field">
              <input id="filter-score" type="range" min="0" max="100" value="0" aria-label="最低分">
              <span id="score-label">0+</span>
            </div>
          </div>
        </details>
      </div>
      <div id="company-list" class="company-list"></div>
    </section>

    <section class="panel" data-panel="applications">
      <div id="applications-list" class="application-list"></div>
    </section>

    <footer class="footer">数据生成时间：<span id="generated-at"></span> · 页面不加载第三方脚本、字体或分析服务</footer>
  </main>

  __EDIT_CONTROLS_MARKER__
  <script type="application/json" id="initial-data">__INITIAL_DATA__</script>
  <script>
    "use strict";
    const EDITABLE = __EDITABLE__;
    const data = JSON.parse(document.getElementById("initial-data").textContent);
    const state = {
      jobs: data.jobs || [],
      applications: data.applications || [],
      companyGroups: data.companyGroups || []
    };
    const actionableStatuses = new Set(["discovered", "saved", "preparing"]);
    const statusLabels = {
      applied:"已投递", screening:"筛选中", assessment:"测评中", interview:"面试中",
      offer:"Offer", rejected:"被拒绝", withdrawn:"已撤回", closed:"已结束", archived:"已归档"
    };
    const poolLabels = {
      discovered:"新发现", saved:"已收藏", preparing:"准备中", applied:"已投递",
      ignored:"已忽略", expired:"已过期", archived:"已归档"
    };

    function node(tag, className, text) {
      const item = document.createElement(tag);
      if (className) item.className = className;
      if (text !== undefined && text !== null) item.textContent = String(text);
      return item;
    }
    function append(parent, ...children) {
      children.filter(Boolean).forEach(child => parent.appendChild(child));
      return parent;
    }
    function safeUrl(value) {
      try {
        const parsed = new URL(value);
        return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : null;
      } catch (_) {
        return null;
      }
    }
    function link(label, href, className) {
      const url = safeUrl(href);
      if (!url) return null;
      const item = node("a", className || "button", label);
      item.href = url;
      item.target = "_blank";
      item.rel = "noopener noreferrer";
      return item;
    }
    function formatDate(value) {
      if (!value) return "未提供";
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime())
        ? value
        : parsed.toLocaleString("zh-CN", {hour12:false});
    }
    function empty(message) {
      return node("div", "empty", message);
    }
    function selectControl(options, value) {
      const control = node("select");
      options.forEach(([key, label]) => {
        const option = node("option", "", label);
        option.value = key;
        option.selected = key === (value || "");
        control.appendChild(option);
      });
      return control;
    }
    function setSaveState(container, text, kind) {
      const target = container.querySelector(".save-state");
      if (!target) return;
      target.className = "save-state" + (kind ? " " + kind : "");
      target.textContent = text;
    }
    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {"Content-Type":"application/json", ...(options.headers || {})}
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw Object.assign(new Error(payload.error || "请求失败"), {status:response.status});
      }
      return payload;
    }
    function reloadAfter(container, message) {
      setSaveState(container, message, "good");
      window.setTimeout(() => window.location.reload(), 450);
    }

    function updateMetrics() {
      document.getElementById("metric-companies").textContent =
        state.companyGroups.filter(group => group.primary).length;
      document.getElementById("metric-preparing").textContent =
        state.jobs.filter(job => job.poolStatus === "preparing").length;
      document.getElementById("metric-applied").textContent =
        state.applications.filter(item => item.status !== "archived").length;
      document.getElementById("metric-interviews").textContent =
        state.applications.filter(item => item.status === "interview").length;
    }

    function populateFilters() {
      const cities = [...new Set(state.jobs.flatMap(job => job.cities || []))].sort();
      const sources = [...new Set(
        state.jobs.flatMap(job => (job.sources || []).map(source => source.name))
      )].sort();
      [["filter-city", cities], ["filter-source", sources]].forEach(([id, values]) => {
        const select = document.getElementById(id);
        values.forEach(value => {
          const option = node("option", "", value);
          option.value = value;
          select.appendChild(option);
        });
      });
    }

    function filtersAreActive() {
      return ["filter-query", "filter-city", "filter-status", "filter-type",
        "filter-source", "filter-freshness"].some(id =>
          document.getElementById(id).value
        ) || Number(document.getElementById("filter-score").value) > 0;
    }

    function jobMatches(job) {
      const query = document.getElementById("filter-query").value.trim().toLowerCase();
      const city = document.getElementById("filter-city").value;
      const status = document.getElementById("filter-status").value;
      const type = document.getElementById("filter-type").value;
      const source = document.getElementById("filter-source").value;
      const freshness = Number(document.getElementById("filter-freshness").value || 0);
      const minimum = Number(document.getElementById("filter-score").value);
      const searchable = [
        job.company, job.title, job.descriptionSummary, ...(job.skills || [])
      ].filter(Boolean).join(" ").toLowerCase();
      const publishedAge = job.publishedAt
        ? (Date.now() - new Date(job.publishedAt).getTime()) / 86400000
        : Infinity;
      return (!query || searchable.includes(query))
        && (!city || (job.cities || []).includes(city))
        && (!status || job.poolStatus === status)
        && (!type || job.recruitmentType === type)
        && (!source || (job.sources || []).some(item => item.name === source))
        && (!freshness || publishedAge <= freshness)
        && Number(job.score || 0) >= minimum;
    }

    function filteredGroup(group) {
      if (!filtersAreActive()) return group;
      const ordered = [
        group.primary, ...(group.alternatives || []), ...(group.remaining || [])
      ].filter(Boolean).filter(jobMatches);
      if (!ordered.length) return null;
      return {
        ...group,
        primary: ordered[0],
        alternatives: ordered.slice(1, 3),
        remaining: ordered.slice(3)
      };
    }

    function recruitmentLabel(value) {
      return {campus:"校招", experienced:"社招"}[value] || value || "类型待确认";
    }

    function verificationLabel(job) {
      const verified = job.verificationState === "verified";
      return node(
        "span",
        "verification " + (verified ? "verified" : "pending"),
        verified ? "已核验" : "待核验"
      );
    }

    function jobTitle(job, className) {
      const titleClass = "job-title-link" + (className ? " " + className : "");
      if (!job.resolvedLink) return node("span", titleClass, job.title);
      return link(job.title + " ↗", job.resolvedLink.url, titleClass);
    }

    function jobFacts(job) {
      const facts = node("div", "job-facts");
      append(
        facts,
        node("span", "", (job.cities || []).join("、") || "城市不限"),
        node("span", "", recruitmentLabel(job.recruitmentType)),
        node("span", "score-text", "匹配 " + Number(job.score || 0)),
        verificationLabel(job),
        job.resolvedLink && job.resolvedLink.searchHint
          ? node("span", "search-hint", "需搜索：" + job.resolvedLink.searchHint)
          : null
      );
      return facts;
    }

    function companyMark(company) {
      const normalized = String(company || "").toLowerCase();
      const brands = [
        {match:["oppo"], mark:"oppo", key:"oppo"},
        {match:["华为", "huawei"], mark:"华", key:"huawei"},
        {match:["字节", "bytedance"], mark:"字", key:"bytedance"},
        {match:["百度", "baidu"], mark:"度", key:"baidu"},
        {match:["大疆", "dji"], mark:"DJI", key:"dji"},
        {match:["科达", "keda"], mark:"科", key:"keda"}
      ];
      const brand = brands.find(item => item.match.some(value => normalized.includes(value)));
      const fallback = String(company || "?").replace(/\s+/g, "").slice(0, 2).toUpperCase();
      const mark = node(
        "span",
        "company-mark" + (brand ? " brand-" + brand.key : ""),
        brand ? brand.mark : fallback
      );
      mark.title = String(company || "公司");
      mark.setAttribute("aria-hidden", "true");
      return mark;
    }

    async function updateJob(job, updates, card) {
      setSaveState(card, "正在保存…", "");
      try {
        await api("/api/jobs/" + encodeURIComponent(job.id), {
          method:"PATCH",
          body:JSON.stringify({updates, lastVerifiedAt:job.lastVerifiedAt})
        });
        reloadAfter(card, "已保存，正在更新推荐顺序…");
      } catch (error) {
        setSaveState(
          card,
          error.status === 409 ? "数据已变化，请刷新页面" : "保存失败：" + error.message,
          "bad"
        );
      }
    }

    async function confirmApplication(job, card) {
      if (!window.confirm("请确认：你已经完成该岗位的实际投递？")) return;
      setSaveState(card, "正在记录投递…", "");
      try {
        await api("/api/applications", {
          method:"POST",
          body:JSON.stringify({jobId:job.id, confirmed:true})
        });
        reloadAfter(card, "投递已记录，正在更新公司限投提醒…");
      } catch (error) {
        setSaveState(card, "记录失败：" + error.message, "bad");
      }
    }

    function primaryJob(job, card) {
      const section = node("section", "primary-job");
      section.appendChild(node("div", "section-label", "主投建议"));
      const heading = node("div", "");
      append(
        heading,
        append(node("h3", "job-title"), jobTitle(job)),
        jobFacts(job)
      );
      append(
        section,
        append(node("div", "job-head"), heading)
      );
      if (EDITABLE) {
        const actions = node("div", "actions");
        const pool = selectControl(Object.entries(poolLabels), job.poolStatus);
        pool.dataset.action = "job-status";
        pool.addEventListener("change", () =>
          updateJob(job, {poolStatus:pool.value}, card)
        );
        const applied = node("button", "button primary", "确认已投递");
        applied.type = "button";
        applied.disabled = job.poolStatus === "applied";
        applied.addEventListener("click", () => confirmApplication(job, card));
        append(actions, pool, applied);
        section.appendChild(actions);
      }
      return section;
    }

    function compactJobRow(job) {
      const row = node("div", "alternative-row");
      const copy = node("div", "");
      append(
        copy,
        append(node("div", "alternative-title"), jobTitle(job)),
        jobFacts(job)
      );
      row.appendChild(copy);
      return row;
    }

    function renderCompanyGroup(group) {
      const card = node("article", "company-card");
      const title = node("div", "");
      append(
        title,
        node("h2", "", group.company),
        node(
          "p",
          "company-meta",
          group.totalJobs + " 个岗位 · " +
            group.activeApplicationCount + " 个进行中投递"
        )
      );
      const badgeClass = group.quotaConflict
        ? "policy-badge conflict"
        : "policy-badge" + (group.policy ? " verified" : "");
      append(
        card,
        append(
          node("header", "company-header"),
          append(node("div", "company-identity"), companyMark(group.company), title),
          node("span", badgeClass, group.policyLabel)
        )
      );
      if (group.quotaConflict) {
        card.appendChild(node(
          "div",
          "quota-warning",
          "已达到该公司的官方投递上限。你仍可查看岗位，但建议先确认是否允许改投。"
        ));
      }
      if (group.primary) {
        card.appendChild(primaryJob(group.primary, card));
      } else {
        card.appendChild(node("div", "primary-job muted", "当前没有可作为主投的岗位。"));
      }
      if ((group.alternatives || []).length) {
        const section = node("section", "alternative-section");
        section.appendChild(node("h3", "", "备选岗位"));
        group.alternatives.forEach(job => section.appendChild(compactJobRow(job)));
        card.appendChild(section);
      }
      if ((group.remaining || []).length) {
        const details = node("details", "other-jobs");
        details.appendChild(node(
          "summary",
          "",
          "查看其他岗位（" + group.remaining.length + "）"
        ));
        group.remaining.forEach(job => details.appendChild(compactJobRow(job)));
        card.appendChild(details);
      }
      card.appendChild(node("div", "save-state", ""));
      return card;
    }

    function renderRecommendations() {
      const root = document.getElementById("company-list");
      root.replaceChildren();
      const groups = state.companyGroups.map(filteredGroup).filter(Boolean);
      if (!groups.length) {
        root.appendChild(empty("没有符合当前筛选条件的公司或岗位"));
        return;
      }
      groups.forEach(group => root.appendChild(renderCompanyGroup(group)));
    }

    async function saveApplication(application, updates, card) {
      setSaveState(card, "正在保存…", "");
      try {
        await api("/api/applications/" + encodeURIComponent(application.id), {
          method:"PATCH",
          body:JSON.stringify({updates, updatedAt:application.updatedAt})
        });
        reloadAfter(card, "已保存，正在更新投递进度…");
      } catch (error) {
        if (error.status === 409) {
          setSaveState(card, "检测到其他修改，正在重新载入…", "bad");
          window.setTimeout(() => window.location.reload(), 800);
        } else {
          setSaveState(card, "保存失败：" + error.message, "bad");
        }
      }
    }

    function renderApplications() {
      const root = document.getElementById("applications-list");
      root.replaceChildren();
      const applications = state.applications.slice().sort((a, b) =>
        String(b.updatedAt).localeCompare(String(a.updatedAt))
      );
      if (!applications.length) {
        root.appendChild(empty("还没有投递记录。完成实际投递后再确认。"));
        return;
      }
      applications.forEach(application => {
        const card = node("article", "application-card");
        card.dataset.applicationId = application.id;
        const heading = node("div", "");
        append(
          heading,
          append(
            node("h2", ""),
            application.officialUrl
              ? link(application.title + " ↗", application.officialUrl, "job-title-link")
              : node("span", "", application.title)
          ),
          node(
            "p",
            "company-meta",
            application.company + " · 投递：" + formatDate(application.appliedAt)
          )
        );
        const statusArea = node("div", "application-status");
        if (EDITABLE) {
          const status = selectControl(Object.entries(statusLabels), application.status);
          status.dataset.action = "application-status";
          status.addEventListener("change", () =>
            saveApplication(application, {status:status.value}, card)
          );
          append(statusArea, node("label", "", "状态"), status);
        } else {
          statusArea.appendChild(node(
            "span",
            "status-badge good",
            statusLabels[application.status] || application.status
          ));
        }
        card.appendChild(append(node("div", "application-head"), heading, statusArea));
        const links = node("div", "application-links");
        append(
          links,
          link("岗位来源", application.officialUrl, "button"),
          link("投递页面", application.applyUrl, "button")
        );
        card.appendChild(links);
        card.appendChild(node("div", "save-state", ""));
        root.appendChild(card);
      });
    }

    function renderAll() {
      updateMetrics();
      renderRecommendations();
      renderApplications();
    }

    document.querySelectorAll("[data-tab]").forEach(button =>
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-tab]").forEach(item =>
          item.classList.toggle("active", item === button)
        );
        document.querySelectorAll("[data-panel]").forEach(panel =>
          panel.classList.toggle("active", panel.dataset.panel === button.dataset.tab)
        );
      })
    );
    [
      "filter-query", "filter-city", "filter-status", "filter-type",
      "filter-source", "filter-freshness", "filter-score"
    ].forEach(id => {
      document.getElementById(id).addEventListener("input", () => {
        document.getElementById("score-label").textContent =
          document.getElementById("filter-score").value + "+";
        renderRecommendations();
      });
    });
    document.getElementById("generated-at").textContent = formatDate(data.generatedAt);
    populateFilters();
    renderAll();
  </script>
</body>
</html>
